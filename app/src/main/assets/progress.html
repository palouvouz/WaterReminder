<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Πρόοδος νερού</title>
  <link rel="stylesheet" href="progress.css">
</head>
<body>
  <div class="ring">
    <svg class="ring__svg" width="210" height="210" viewBox="0 0 210 210" aria-hidden="true">
      <defs>
        <linearGradient id="ring-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop class="ring__stop-start" offset="0%"></stop>
          <stop class="ring__stop-end" offset="100%"></stop>
        </linearGradient>
      </defs>
      <circle class="ring__track" cx="105" cy="105" r="92"></circle>
      <circle class="ring__bar" id="ring-bar" cx="105" cy="105" r="92"></circle>
    </svg>
    <div class="ring__label">
      <span class="ring__percent" id="ring-percent">0%</span>
      <span class="ring__amount" id="ring-amount"></span>
    </div>
  </div>
  <script src="progress.js"></script>
</body>
</html>
